<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Advertising Soda</title>
  </head>
  <body>
    <main>
      <div class="item active" style="--background: #ea3d41">
        <div class="title">Morango</div>
        <img src="./img/fundo-morango2.png" alt="fundo morango" class="fruit" />
        <img src="./img/refri-morango.png" alt="refri morango" class="refri" />
      </div>

      <div class="item" style="--background: #2d5643">
        <div class="title">Abacate</div>
        <img src="./img/fundo-abacate2.png" alt="fundo abacate" class="fruit" />
        <img src="./img/refri-abacate.png" alt="refri abacate" class="refri" />
      </div>

      <div class="item" style="--background: #e7a043">
        <div class="title">Laranja</div>
        <img src="./img/fundo-laranja2.png" alt="fundo laranja" class="fruit" />
        <img src="./img/refri-laranja.png" alt="refri laranja" class="refri" />
      </div>

      <div class="arrow">
        <button id="prev"><</button>
        <button id="next">></button>
      </div>
    </main>

    <script src="./scripts.js"></script>
  </body>
</html>
